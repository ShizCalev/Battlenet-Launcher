name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[18.0,19.0)'
      - name: Build launcher
        run: msbuild Battlenet-Launcher.vcxproj /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}
      - name: Test launcher lifecycle with mock processes
        shell: pwsh
        run: .\Tests\run.ps1 -Platform ${{ matrix.platform }} -Configuration ${{ matrix.configuration }}
